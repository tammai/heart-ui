<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading... | Heart UI</title>
  <style>
    body {
      margin: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      background-color: oklch(0.929 0.013 255.508);
    }

    .loader {
        height: 6px;
        width: 6px;
        color: oklch(0.372 0.044 257.287);
        box-shadow: -12px -12px 0 6px,
                    -12px -12px 0 6px,
                    -12px -12px 0 6px,
                    -12px -12px 0 6px;
        animation: loader-38 5s infinite;
      }

      @keyframes loader-38 {
        0% {
          box-shadow: -12px -12px 0 6px,
                      -12px -12px 0 6px,
                      -12px -12px 0 6px,
                      -12px -12px 0 6px;
        }
        8.33% {
          box-shadow: -12px -12px 0 6px,
                      12px -12px 0 6px,
                      12px -12px 0 6px,
                      12px -12px 0 6px;
        }
        16.66% {
          box-shadow: -12px -12px 0 6px,
                      12px -12px 0 6px,
                      12px 12px 0 6px,
                      12px 12px 0 6px;
        }
        24.99% {
          box-shadow: -12px -12px 0 6px,
                      12px -12px 0 6px,
                      12px 12px 0 6px,
                      -12px 12px 0 6px;
        }
        33.32% {
          box-shadow: -12px -12px 0 6px,
                      12px -12px 0 6px,
                      12px 12px 0 6px,
                      -12px -12px 0 6px;
        }
        41.65% {
          box-shadow: 12px -12px 0 6px,
                      12px -12px 0 6px,
                      12px 12px 0 6px,
                      12px -12px 0 6px;
        }
        49.98% {
          box-shadow: 12px 12px 0 6px,
                    12px 12px 0 6px,
                    12px 12px 0 6px,
                    12px 12px 0 6px;
        }
        58.31% {
          box-shadow: -12px 12px 0 6px,
                      -12px 12px 0 6px,
                      12px 12px 0 6px,
                      -12px 12px 0 6px;
        }
        66.64% {
          box-shadow: -12px -12px 0 6px,
                      -12px -12px 0 6px,
                      12px 12px 0 6px,
                      -12px 12px 0 6px;
        }
        74.97% {
          box-shadow: -12px -12px 0 6px,
                      12px -12px 0 6px,
                      12px 12px 0 6px,
                      -12px 12px 0 6px;
        }
        83.3% {
          box-shadow: -12px -12px 0 6px,
                      12px 12px 0 6px,
                      12px 12px 0 6px,
                      -12px 12px 0 6px;
        }
        91.63% {
          box-shadow: -12px -12px 0 6px,
                      -12px 12px 0 6px,
                      -12px 12px 0 6px,
                      -12px 12px 0 6px;
        }
        100% {
          box-shadow: -12px -12px 0 6px,
                      -12px -12px 0 6px,
                      -12px -12px 0 6px,
                      -12px -12px 0 6px;
        }
      }

    
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
  </div>
</body>
</html>
